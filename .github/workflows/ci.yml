# CI GitHub : même contenu que .gitlab-ci.yml.
name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check # tokens + Oxlint + Stylelint + Prettier + TypeScript
      - run: npm run build # tokens (web, Android, iOS) + librairie

  a11y:
    needs: check
    runs-on: ubuntu-latest
    # La version de l'image DOIT correspondre au paquet « playwright » de package.json
    container: mcr.microsoft.com/playwright:v1.49.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build:storybook
      - run: node scripts/test-a11y.mjs
